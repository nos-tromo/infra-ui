name: release-tag
# Mints the annotated vX.Y.Z tag on merge to main by reading package.json's
# "version" via the shared reusable workflow. Idempotent: no-op unless the
# version changed. Bumping package.json in the release PR is the whole
# release action — tags are not hand-cut. See nos-tromo/.github
# actions/release-tag.
on:
  push:
    branches: [main]
permissions:
  contents: write        # a reusable workflow's token perms come from the caller
concurrency:
  group: release-tag-${{ github.ref }}   # serialize rapid successive merges
jobs:
  tag:
    uses: nos-tromo/.github/.github/workflows/release-tag.yml@2715bedabe594a449e411182393e68da59c791f3 # v3.22
    with:
      version-file: package.json
      version-source: package-json
