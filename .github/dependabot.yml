version: 2
# Every update waits 7 days after its upstream release before Dependabot
# proposes it, so a compromised or broken release is usually caught upstream
# first. Security updates are exempt and still open immediately. Our own
# nos-tromo/* workflows skip the wait, so a hub release is not held back.
updates:
  # github-actions only — the workflow refs are SHA-pinned, so dependabot is
  # what keeps them current. The pnpm dependencies are managed by hand
  # alongside the committed prebuilt dist/, which every bump has to rebuild.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude:
        - "nos-tromo/*"
